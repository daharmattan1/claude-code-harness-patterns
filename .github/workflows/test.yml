name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: git --version && bash --version | head -1
      - name: hooks
        run: python -m pytest hooks/tests -q
      - name: specialist-memory
        run: python -m pytest specialist-memory/tests -q
      - name: prd-loop
        run: python -m pytest prd-loop/tests -q
      - name: multi-terminal-git (safety gate)
        run: python -m pytest multi-terminal-git/tests -q
      - name: multi-terminal-git (scripts)
        run: bash multi-terminal-git/tests/run.sh
